name: Validate packaging metadata

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate manifest and dependency graph
        run: ./scripts/check --metadata-only

  rpm-static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fedora: [44, 45]
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - name: Install checkout and RPM tooling
        run: dnf -y install git python3-pyyaml rpm-build rpmlint cmake meson systemd-rpm-macros glibc-langpack-en
      - uses: actions/checkout@v4
      - name: Parse and lint specs
        run: ./scripts/check
